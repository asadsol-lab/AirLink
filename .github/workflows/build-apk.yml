name: Build AirLink APK & Keep Latest 2 Releases

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare debug.keystore from debug.keystore.base64
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        id: prep
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="build-${{ github.run_number }}-${SHORT_SHA}"
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="AirLink-${TAG}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK_OUT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with New APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prep.outputs.tag }}" \
            "${{ steps.prep.outputs.apk }}" \
            --title "AirLink ${{ steps.prep.outputs.tag }}" \
            --notes "Automated APK build from commit ${{ github.sha }}"

      - name: Keep Only Latest 2 Releases (Delete Older APKs & Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName')

          if [ -n "$OLD_TAGS" ]; then
            for tag in $OLD_TAGS; do
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          else
            echo "2 or fewer releases exist; nothing to delete."
          fi
